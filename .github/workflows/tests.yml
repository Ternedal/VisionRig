name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  kotlin-producer-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - run: gradle -p clients/kaliv-producer-core test --no-daemon

  android-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: gradle -p clients/kaliv-android-producer :library:assembleDebug :library:testDebugUnitTest --no-daemon


  quest-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - run: gradle -p clients/kaliv-quest-producer :library:assembleDebug :library:testDebugUnitTest --no-daemon

  release-gate-runner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - shell: pwsh
        run: .\run-v1-release-gate.ps1 -StatusOnly -AllowDetachedHeadForCi
      # The operator runs the repository-authority verifier in PowerShell on
      # Windows. The ubuntu job runs its contract; run it here too.
      - name: Repository-authority verifier contract on real Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pytest -q tests/test_repository_authority_verifier.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
