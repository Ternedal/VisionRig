# Dependabot: weekly, grouped, small PR budget so updates arrive as a few
# reviewable PRs instead of a stream. Every bump still runs the full CI and is
# landed by hand -- nothing moves silently. Added 06/11-2026 across the Kaliv
# repos; ModelRig had this since 1.58.42.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      # codeql init/analyze must move together or analysis fails
      codeql-action:
        patterns: ["github/codeql-action*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["github/codeql-action*"]
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    ignore:
      # mediapipe 1.x removed the legacy `mediapipe.solutions` API that
      # landmarks_mediapipe.py uses (Holistic, PoseLandmark, HandLandmark).
      # CI installs only `.[dev]`, so a widened bound would pass CI untested.
      # Lift this when the backend moves to the MediaPipe Tasks API.
      - dependency-name: "mediapipe"
        versions: [">=1"]
    groups:
      # minor/patch ride together; a major gets its own PR for review
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Both producer builds include ../kaliv-producer-core, and all three must
  # compile with the same Kotlin version (Kotlin metadata is only readable one
  # minor version ahead). Listing both builds here keeps a grouped bump from
  # moving core and the Android producer while leaving the Quest producer
  # behind, which is what broke #188.
  - package-ecosystem: gradle
    directories:
      - /clients/kaliv-android-producer
      - /clients/kaliv-quest-producer
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      android-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # A major stays its own PR per dependency, but one PR for both builds
      # instead of one per directory (both reach core through includeBuild,
      # which produced the duplicate pairs #193/#195 and #194/#196).
      producer-majors:
        group-by: dependency-name
        update-types: ["major"]
